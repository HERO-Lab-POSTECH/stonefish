version: '3.8'

services:
  stonefish:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: luckkim123/stonefish-ros1-noetic:1.0.2
    container_name: stonefish-ros1-noetic
    stdin_open: true
    tty: true
    privileged: true

    # Enable GUI (X11 forwarding)
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/tmp/runtime-root}
      - QT_X11_NO_MITSHM=1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311

    volumes:
      # X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    # GPU access (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [compute, utility, graphics]

    # Memory and IPC settings
    shm_size: 32g
    ipc: host
    network_mode: host

    command: >
      bash -c "
        mkdir -p ${XDG_RUNTIME_DIR:-/tmp/runtime-root} &&
        chmod 700 ${XDG_RUNTIME_DIR:-/tmp/runtime-root} &&
        /bin/bash
      "
