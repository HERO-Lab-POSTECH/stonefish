version: '3.8'

services:
  stonefish:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: luckkim123/stonefish-ros1-noetic:1.0.0
    container_name: stonefish-ros1-noetic-test

    # Enable GUI (X11 forwarding)
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/tmp/runtime-root}
      - QT_X11_NO_MITSHM=1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311

    volumes:
      # X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    # GPU access (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Network mode for ROS communication
    network_mode: host

    # Keep container running
    stdin_open: true
    tty: true

    command: >
      bash -c "
        mkdir -p ${XDG_RUNTIME_DIR:-/tmp/runtime-root} &&
        chmod 700 ${XDG_RUNTIME_DIR:-/tmp/runtime-root} &&
        /bin/bash
      "
